name: Release

# Publishes to npm when a version tag is pushed (e.g. `git tag v0.1.15 && git push --tags`).
# The tag must match the version in package.json. Requires an `NPM_TOKEN` repository
# secret (an npm "Automation" token) - see CONTRIBUTING.md "Releasing".

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # to create the GitHub Release
  id-token: write   # for npm provenance

jobs:
  verify:
    name: Verify tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::Tag v$TAG does not match package.json version $PKG"; exit 1; }

  test:
    name: Run CI before publishing
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
