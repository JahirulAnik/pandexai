[project]
name = "pandexai"
version = "0.1.14"
description = "PandexAI - AI-native data profiling and cleaning CLI. Deterministic pandas scripts driven by an AI coding CLI."
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["pandex-sandbox", "test_fixtures"]

[tool.ruff.lint]
# Keep it pragmatic: pyflakes + pycodestyle errors + import sorting.
select = ["E", "F", "I"]
ignore = ["E501"]
